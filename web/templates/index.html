<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watchlist Burner</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="ambient-glow glow-green"></div>
  <div class="ambient-glow glow-orange"></div>
  <div class="ambient-glow glow-cyan"></div>

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <h1 class="logo">Watchlist</h1>

      <div class="logo-wrap">
        <img src="/static/logo.svg" class="logo-icon" alt="Watchlist Burner">
      </div>
    </div>

    <div class="actions">
      <!-- Segmented Status Bar for Film Stats -->
      <div class="statusbar" id="statusBar" hidden>
        <div class="statusbar-seg statusbar-watched" id="barWatched"></div>
        <div class="statusbar-seg statusbar-library" id="barLibrary"></div>
        <div class="statusbar-seg statusbar-nolib" id="barNolib"></div>
      </div>
      <span id="status" class="status"></span>
      <button id="logoutBtn" class="btn btn-ghost" hidden>Log out</button>
    </div>
  </header>

  <!-- SETUP VIEW -->
  <section id="setupView" class="view" hidden>
    <div class="auth-container">
      <div class="card glass-card">
        
        <div class="card-header">
          <div class="icon-badge">
            <img src="/static/logo.svg" alt="Logo" class="hero-icon">
          </div>
          <h2>Connect Your Libraries</h2>
          <p class="subtitle">Sync your Letterboxd watchlist directly with your Jellyfin server.</p>
        </div>

        <form id="setupForm" class="auth-form" autocomplete="on">

          <!-- Letterboxd Username -->
          <div class="field-group">
            <label for="letterboxdUser">Letterboxd Username</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
              </span>
              <input type="text" id="letterboxdUser" name="letterboxdUser" placeholder="username" autocomplete="username" required spellcheck="false">
            </div>
          </div>

          <div class="form-divider">
            <span>Jellyfin Credentials</span>
          </div>

		  <!-- Jellyfin URL -->
          <div class="field-group">
            <label for="jellyfinUrl">Jellyfin Server URL</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
              </span>
              <input type="url" id="jellyfinUrl" name="jellyfinUrl" placeholder="http://192.168.1.10:8096" required spellcheck="false">
            </div>
          </div>

          <!-- Jellyfin Username -->
          <div class="field-group">
            <label for="jellyfinUser">Jellyfin Username</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input type="text" id="jellyfinUser" name="jellyfinUser" placeholder="username" autocomplete="username" required spellcheck="false">
            </div>
          </div>

          <!-- Jellyfin Password -->
          <div class="field-group">
            <label for="jellyfinPassword">Jellyfin Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="jellyfinPassword" name="jellyfinPassword" placeholder="••••••••••••" autocomplete="current-password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <span>Burn Watchlist</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>

        <p id="setupError" class="error-banner" hidden></p>

      </div>
    </div>
  </section>

  <!-- LOGIN / RE-AUTH VIEW -->
  <section id="loginView" class="view" hidden>
    <div class="auth-container">
      <div class="card glass-card">
        
        <div class="card-header">
          <div class="icon-badge">
            <img src="/static/logo.svg" alt="Logo" class="hero-icon">
          </div>
          <h2>Session Expired</h2>
          <p class="subtitle">Please re-enter your Jellyfin password to continue.</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="field-group">
            <label for="loginJellyfinPassword">Jellyfin Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="loginJellyfinPassword" name="jellyfinPassword" placeholder="••••••••••••" autocomplete="current-password" required autofocus>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <span>Reconnect</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>

        <p id="loginError" class="error-banner" hidden></p>
      </div>
    </div>
  </section>

  <!-- LOADING VIEW -->
  <section id="loadingView" class="view" hidden>
    <div class="loading-wrap">
      <div class="progress-ring" id="progressRing">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--flame-green)"></stop>
              <stop offset="100%" stop-color="var(--flame-cyan)"></stop>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fill" id="progressFill" cx="60" cy="60" r="52"></circle>
        </svg>
        <span id="progressPct" class="progress-pct">0%</span>
      </div>
      <p id="loadingText" class="loading-text">Wait, you've watched how many?!</p>
      <p id="loadingDetail" class="loading-detail">400 movies in your library so far — e.g. "Dark Waters"</p>
    </div>
  </section>

  <!-- GRID VIEW -->
  <section id="gridView" class="view" hidden>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden></p>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
